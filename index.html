.x { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; padding: 2px 6px; }
.progress { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }

function shrink(file, max = 1800) {
  return new Promise(res => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      if (k === 1 && file.size < 2.5e6 && /jpeg|png|webp/.test(file.type)) { URL.revokeObjectURL(url); return res(file); }
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => res(b || file), "image/jpeg", 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}
async function uploadPhotos(pid, files) {
  const box = $("#photos");
  for (const f of files) {
    box.insertAdjacentHTML("beforeend", `<p class="muted uploading">Uploading ${esc(f.name)}…</p>`);

      const r = await assets.upload(blob, { type: blob.type || "image/jpeg" });
      (state.photos[pid] = state.photos[pid] || []).push(r.id); save();
    } catch (e) {
      const why = { too_large: "is too large", unsupported_type: "isn't a supported image type", quota_or_state: "didn't fit: photo storage is full", rate_limited: "was rate-limited; try again in a minute" }[e?.code] || "failed to upload";
      box.insertAdjacentHTML("beforeend", `<p class="err">${esc(f.name)} ${why}.</p>`);
    }
    box.querySelector(".uploading")?.remove();
  }
  const errs = [...box.querySelectorAll(".err")].map(n => n.outerHTML).join("");

/* ---------- Light (sun position, after the SunCalc formulas) ---------- */
const PLACES = [
  ["kc", "Kansas City, MO", 39.0997, -94.5786, "America/Chicago"],
  ["nyc", "New York, NY", 40.7128, -74.006, "America/New_York"],
  ["chi", "Chicago, IL", 41.8781, -87.6298, "America/Chicago"],
  ["den", "Denver, CO", 39.7392, -104.9903, "America/Denver"],
  ["la", "Los Angeles, CA", 34.0522, -118.2437, "America/Los_Angeles"],
  ["mia", "Miami, FL", 25.7617, -80.1918, "America/New_York"],
  ["dal", "Dallas, TX", 32.7767, -96.797, "America/Chicago"],
  ["sea", "Seattle, WA", 47.6062, -122.3321, "America/Los_Angeles"],
  ["custom", "Custom coordinates", null, null, null],
];
const RAD = Math.PI / 180, DAY = 864e5, J1970 = 2440588, J2000 = 2451545, OBL = RAD * 23.4397, J0 = 0.0009;
function sunTimes(date, lat, lng) {
  const toDays = d => d.valueOf() / DAY - 0.5 + J1970 - J2000;
  const fromJ = j => new Date((j + 0.5 - J1970) * DAY);
  const lw = RAD * -lng, phi = RAD * lat, d = toDays(date);
  const n = Math.round(d - J0 - lw / (2 * Math.PI));
  const ds = J0 + lw / (2 * Math.PI) + n;
  const M = RAD * (357.5291 + 0.98560028 * ds);
  const L = M + RAD * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M)) + RAD * 102.9372 + Math.PI;
  const dec = Math.asin(Math.sin(L) * Math.sin(OBL));
  const transit = a => J2000 + a + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  const noon = transit(ds);
  const at = h => {
    const w = Math.acos((Math.sin(h * RAD) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec)));
    if (isNaN(w)) return [null, null];
    const set = transit(J0 + (w + lw) / (2 * Math.PI) + n);
    return [fromJ(noon - (set - noon)), fromJ(set)];
  };
  const r = {}; for (const [k, h] of [["six", -6], ["four", -4], ["sun", -0.833], ["gold", 6]]) { const [a, b] = at(h); r[k + "Rise"] = a; r[k + "Set"] = b; }
  r.noon = fromJ(noon);
  return r;
}
/* Place search: GeoNames US cities of 50,000+ plus the largest towns in each state */
const STATES = { AL: "Alabama", AK: "Alaska", AZ: "Arizona", AR: "Arkansas", CA: "California", CO: "Colorado", CT: "Connecticut", DE: "Delaware", DC: "District of Columbia", FL: "Florida", GA: "Georgia", HI: "Hawaii", ID: "Idaho", IL: "Illinois", IN: "Indiana", IA: "Iowa", KS: "Kansas", KY: "Kentucky", LA: "Louisiana", ME: "Maine", MD: "Maryland", MA: "Massachusetts", MI: "Michigan", MN: "Minnesota", MS: "Mississippi", MO: "Missouri", MT: "Montana", NE: "Nebraska", NV: "Nevada", NH: "New Hampshire", NJ: "New Jersey", NM: "New Mexico", NY: "New York", NC: "North Carolina", ND: "North Dakota", OH: "Ohio", OK: "Oklahoma", OR: "Oregon", PA: "Pennsylvania", RI: "Rhode Island", SC: "South Carolina", SD: "South Dakota", TN: "Tennessee", TX: "Texas", UT: "Utah", VT: "Vermont", VA: "Virginia", WA: "Washington", WV: "West Virginia", WI: "Wisconsin", WY: "Wyoming", PR: "Puerto Rico" };
let placesDb = null, placesLoading = null, sampleApi = null;
// Lowercase, strip accents, and spell out St./Ft./Mt. so "St. Augustine" finds "Saint Augustine".
const placeKey = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\./g, "")
  .replace(/\bst\s/g, "saint ").replace(/\bft\s/g, "fort ").replace(/\bmt\s/g, "mount ").replace(/\s+/g, " ").trim();
function loadPlaces() {
  // Major US cities are embedded in the page so it works offline and as a shared file.
  placesLoading = placesLoading || Promise.resolve().then(() => {
    const d = JSON.parse($("#places-data").textContent);
    placesDb = d.c.map(c => ({ n: c[0], k: placeKey(c[0]), st: c[1], lat: c[2], lng: c[3], tz: d.tz[c[4]], pop: c[5] }));
    return placesDb;
  }).catch(() => { placesLoading = null; return null; });
  return placesLoading;
}
function placeLabel() {
  const L = state.light;
  return L.label || (PLACES.find(p => p[0] === L.place && p[2] !== null)?.[1]) || (L.place === "custom" ? "Custom coordinates" : "");
}
function findPlaces(q) {
  if (!placesDb) return [];
  const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
  const [cityRaw, stRaw = ""] = q.split(",");
  const city = placeKey(cityRaw), st = norm(stRaw);
  if (city.length < 2) return [];
  const stOk = p => !st || p.st.toLowerCase().startsWith(st) || norm(STATES[p.st] || "").startsWith(st);
  const starts = [], contains = [];
  for (const p of placesDb) {
    if (!stOk(p)) continue;
    if (p.k.startsWith(city)) starts.push(p); else if (contains.length < 8 && p.k.includes(city)) contains.push(p);
    if (starts.length >= 40) break;
  }
  starts.sort((a, b) => (b.k === city) - (a.k === city) || b.pop - a.pop);
  return starts.concat(contains).slice(0, 8);
}

}
async function askClaudePlace() {
  const q = $("#placeQ").value.trim(), st = $("#askStatus");
  if (!q) { st.textContent = "Type the town or venue name in the box above first."; return; }
  st.textContent = "Looking up " + q + "…";
  try {
    const r = await sampleApi.json(`Give the location of this place, which may be a city, small town, or wedding venue anywhere in the world: "${q}". Reply with JSON only, no other text: {"name": "<place name, region>", "lat": <decimal latitude>, "lng": <decimal longitude>, "tz": "<IANA time zone, e.g. America/Chicago>"}. If you are not reasonably sure where it is, reply {"error": "unknown"}.`, { modelTier: "quick" });
    const okTz = tz => { try { new Intl.DateTimeFormat("en-US", { timeZone: tz }); return true; } catch (e) { return false; } };
    if (!r || r.error || !isFinite(r.lat) || !isFinite(r.lng) || Math.abs(r.lat) > 90 || Math.abs(r.lng) > 180 || !okTz(r.tz)) { st.textContent = `Couldn't find "${q}". Try adding the state, or enter coordinates.`; return; }
    setPlace(String(r.name || q).slice(0, 80), +r.lat, +r.lng, r.tz);
  } catch (e) {
    st.textContent = e?.code === "not_granted" ? "Lookup was not allowed. Enter coordinates instead." : e?.code === "rate_limited" ? "Too many lookups just now. Try again in a minute." : "Lookup failed. Enter coordinates instead.";
  }
}

function viewLight() {
  if (!placesDb) loadPlaces();
  const L = state.light;
  const now = new Date(), today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
  const dateStr = L.date || today;
  const [y, m, dd] = dateStr.split("-").map(Number);
  const ok = isFinite(L.lat) && isFinite(L.lng) && L.lat !== null && L.lng !== null;
  const tz = L.tz || Intl.DateTimeFormat().resolvedOptions().timeZone;
  let body = `<p class="empty">Enter a latitude and longitude to see light windows.</p>`;
  if (ok) {
    const t = sunTimes(new Date(Date.UTC(y, m - 1, dd, 12)), L.lat, L.lng);
    const fmt = d => d ? d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", timeZone: tz }) : "—";
    const W = [
      ["Morning blue hour", t.sixRise, t.fourRise, "var(--sky)", "Even, cool, soft. Quiet portraits, skylines, lit venues."],
      ["Morning golden hour", t.fourRise, t.goldRise, "var(--gold)", "Warm, low and directional. Rare at weddings; great for elopements."],
      ["Evening golden hour", t.goldSet, t.fourSet, "var(--gold)", "Warm backlight and rim light. Plan couple portraits here."],
      ["Evening blue hour", t.fourSet, t.sixSet, "var(--sky)", "Deep blue sky. Add flash or sparklers; mood shots, exits."],
    ];
    const s0 = t.sixRise ? t.sixRise.valueOf() : null, s1 = t.sixSet ? t.sixSet.valueOf() : null;
    let bar = "";
    if (s0 && s1) {
      const span = s1 - s0, pos = d => ((d.valueOf() - s0) / span * 100).toFixed(2);
      bar = `<div class="timeline" aria-hidden="true">${W.map(w => w[1] && w[2] ? `<div class="seg" style="left:${pos(w[1])}%;width:${pos(w[2]) - pos(w[1])}%;background:${w[3]};opacity:.85"></div>` : "").join("")}
</div><div class="ticks"><span>${fmt(t.sixRise)}</span><span>noon ${fmt(t.noon)}</span><span>${fmt(t.sixSet)}</span></div>`;
    }
    body = `${bar}
      <div class="card"><div class="row spread"><span class="label">Sunrise</span><span class="time">${fmt(t.sunRise)}</span></div>
        <div class="row spread"><span class="label">Sunset</span><span class="time">${fmt(t.sunSet)}</span></div></div>
      <div class="list">${W.map(w => `<div class="card win"><span class="sw" style="background:${w[3]}"></span>
        <div><h3>${w[0]}</h3><p class="muted">${w[4]}</p></div><span class="time">${fmt(w[1])}<br>${fmt(w[2])}</span></div>`).join("")}</div>
      <p class="muted">Times in ${esc(tz)}. Golden hour = sun from 6° above to 4° below the horizon; blue hour = 4° to 6° below. Hills and buildings make the real light end earlier.</p>
      <p class="muted small">Place data from <a href="https://www.geonames.org/" target="_blank" rel="noopener">GeoNames</a> (CC BY 4.0).</p>`;
  }
  return `<div class="view">
    <div class="card">
      <label class="label" for="placeQ">Venue city</label>
      <div class="ac"><input type="text" id="placeQ" placeholder="City, state (e.g. Napa, CA)" autocomplete="off" value="${esc(placeLabel())}" role="combobox" aria-controls="sugg" aria-expanded="false">
        <div class="sugg" id="sugg" role="listbox" hidden></div></div>
      ${ok ? `<p class="muted small">${esc(placeLabel())} · ${L.lat.toFixed(3)}, ${L.lng.toFixed(3)} · ${esc(tz)}</p>` : ""}
      <details class="more" ${L.place === "custom" ? "open" : ""}><summary>Not on the list?</summary>
        <div class="view" style="padding-top:8px;gap:8px">
          ${sampleApi ? `<p class="muted small">Type a small town or a venue name above, then:</p><button class="btn" data-askplace>Look it up with Claude</button><p class="muted small" id="askStatus" aria-live="polite"></p>` : ""}
          <p class="muted small">Or enter coordinates. In Google Maps, long-press the venue to copy them.</p>
          <div class="grid2"><div><label class="label" for="lat">Latitude</label><input type="number" step="any" id="lat" value="${L.lat ?? ""}"></div>
          <div><label class="label" for="lng">Longitude</label><input type="number" step="any" id="lng" value="${L.lng ?? ""}"></div></div>
        </div></details>
      <label class="label" for="date">Date</label><input type="date" id="date" value="${dateStr}">
    </div>
    ${body}
  </div>`;
}

/* ---------- Render + events ---------- */
function render() {
  renderTabs();
  const v = { method: viewMethod, cards: viewCards, boards: viewBoards, camera: viewCamera, light: viewLight }[ui.tab] || viewCards;
  $("#app").innerHTML = v();
}
let pendingDel = null;
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.subject) { ui.subject = d.subject; saveUi(); render(); }
  else if (d.found) { ui.found = d.found; saveUi(); render(); }
  else if (d.placepick) { const p = suggList[+d.placepick]; if (p) setPlace(`${p.n}, ${p.st}`, p.lat, p.lng, p.tz); }
  else if ("askplace" in d) askClaudePlace();
  else if (d.lenspick || d.lightpick) {
    if (d.lenspick) ui.lens = d.lenspick; else ui.light = d.lightpick;
    saveUi(); $("#camset").innerHTML = camHtml(poseById(d.pid));
  }
  else if (d.camsec) { ui.camSec = d.camsec; saveUi(); render(); }
  else if (d.lenstoggle) {
    const ls = state.gear.lenses, i = ls.indexOf(d.lenstoggle);
    if (i >= 0) ls.splice(i, 1); else ls.push(d.lenstoggle);
    save(); render();
  }
  else if (d.tab && t.closest("#sheet")) { ui.tab = d.tab; saveUi(); closeSheet(); window.scrollTo(0, 0); }
  else if (d.show) openShow(d.show, d.photo !== undefined ? +d.photo : -1);
  else if (d.showview) { showState.view = +d.showview; drawShow(); }
  else if ("flip" in d) { showState.flip = !showState.flip; drawShow(); }
  else if ("closeshow" in d) closeShow();
  else if (d.rmphoto) {
    if (t.textContent !== "Remove?") { t.textContent = "Remove?"; t.classList.add("confirm"); return; }
    const id = state.photos[d.rmphoto].splice(+d.i, 1)[0]; save();
    assets?.delete(id).catch(() => {});
    $("#photos").innerHTML = photoGrid(d.rmphoto);
  }
  else if (d.pose) { e.preventDefault(); openPose(d.pose); }
  else if (t.id === "addPose") openNewPose();
  else if ("close" in d) closeSheet();
  else if (d.delpose) {
    if (t.textContent !== "Tap again to delete") { t.textContent = "Tap again to delete"; return; }
    state.mine = state.mine.filter(p => p.id !== d.delpose); delete state.notes[d.delpose]; save(); closeSheet();
  }
  else if (d.addboard) {
    const pick = $("#boardPick");
    pick.innerHTML = `<div class="sec"><span class="label">Add to which shot list?</span><div class="row">${state.boards.map(b => `<button class="btn small" data-addto="${b.id}" data-p="${d.addboard}">${esc(b.name)}</button>`).join("") || `<span class="muted">Create a shot list first in the Shots tab.</span>`}</div></div>`;
    pick.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  else if (d.addto) {
    const b = state.boards.find(x => x.id === d.addto), p = poseById(d.p);
    b.items.push({ id: uid(), text: p.name, pose: p.id, done: false }); save();
    t.textContent = "Added ✓"; t.disabled = true;
  }
  else if (d.board) { ui.board = d.board; saveUi(); render(); window.scrollTo(0, 0); }
  else if ("boards" in d) { ui.board = null; saveUi(); render(); }
  else if (d.rmitem) { const b = state.boards.find(x => x.id === ui.board); b.items = b.items.filter(i => i.id !== d.rmitem); save(); render(); }
  else if (d.reset) { state.boards.find(x => x.id === d.reset).items.forEach(i => i.done = false); save(); render(); }
  else if (d.delboard) {
    if (t.textContent !== "Tap again to delete") { t.textContent = "Tap again to delete"; return; }
    state.boards = state.boards.filter(b => b.id !== d.delboard); ui.board = null; save(); saveUi(); render();
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "sensor") { state.gear.sensor = t.value; save(); render(); return; }
  if (t.id === "photoIn") { if (t.files.length && assets) uploadPhotos(t.dataset.for, [...t.files]); t.value = ""; return; }
  if (t.dataset.toggle) { const b = state.boards.find(x => x.id === ui.board); b.items.find(i => i.id === t.dataset.toggle).done = t.checked; save(); render(); }
  else if (t.id === "place") {
    const p = PLACES.find(x => x[0] === t.value);
    state.light.place = p[0];
    if (p[2] !== null) Object.assign(state.light, { lat: p[2], lng: p[3], tz: p[4] });
    else state.light.tz = null;
    save(); render();
  }
  else if (t.id === "lat" || t.id === "lng") {
    const v = parseFloat(t.value);
    Object.assign(state.light, { [t.id]: isFinite(v) ? v : null, place: "custom", label: "Custom coordinates", tz: null });
    save(); render();
  }
  else if (t.id === "date") { state.light.date = t.value; save(); render(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#show").hidden) closeShow();
  if (e.target.id === "placeQ") {
    if (e.key === "Enter" && suggList[0] && !$("#sugg").hidden) { e.preventDefault(); const p = suggList[0]; setPlace(`${p.n}, ${p.st}`, p.lat, p.lng, p.tz); }
    if (e.key === "Escape") $("#sugg").hidden = true;
  }
});
document.addEventListener("focusin", e => { if (e.target.id === "placeQ") e.target.select(); });
document.addEventListener("pointerdown", e => { const s = $("#sugg"); if (s && !s.hidden && !e.target.closest(".ac")) s.hidden = true; });
let noteTimer;
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "placeQ") { showSuggestions(t.value); return; }
  if (t.id === "q") { ui.q = t.value; saveUi(); const pos = t.selectionStart; render(); const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos); }
  else if (t.dataset.noteid) { state.notes[t.dataset.noteid] = t.value; clearTimeout(noteTimer); noteTimer = setTimeout(save, 600); }
});
document.addEventListener("submit", e => {
  if (e.target.id === "newBoard") {
    e.preventDefault(); const n = $("#boardName").value.trim(); if (!n) return;
    const b = { id: uid(), name: n, items: [] }; state.boards.unshift(b); ui.board = b.id; save(); saveUi(); render();
  } else if (e.target.id === "addItem") {
    e.preventDefault(); const v = $("#itemText").value.trim(); if (!v) return;
    state.boards.find(x => x.id === ui.board).items.push({ id: uid(), text: v, done: false }); save(); render(); $("#itemText").focus();
  }
});
if (ui.board && !state.boards.some(b => b.id === ui.board)) ui.board = null;
render();
</script>
</body>
</html>
